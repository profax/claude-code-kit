[package]
name = "quotaline"
version = "0.1.4"
description = "A status line for Claude Code: context, subscription limits and the time until they reset"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.89"
publish = false

[lints]
workspace = true

[dependencies]
jiff = "1.0.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11.2", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
