[workspace]
members = ["quotaline"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/profax/claude-code-kit"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
